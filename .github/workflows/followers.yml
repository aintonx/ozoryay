name: Подписчики

# Раз в три часа берём свежее число подписчиков и, если оно изменилось,
# коммитим — а следом просим деплой пересобрать сайт.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: followers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Спросить инстаграм
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/fetch-followers.mjs

      - name: Закоммитить, если изменилось
        id: commit
        run: |
          if git diff --quiet -- public/data/followers.json; then
            echo "изменений нет"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/followers.json
          git commit -m "Подписчики: свежее число"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Push, сделанный самим Actions, не запускает другие workflow —
      # это защита от бесконечных циклов. Поэтому деплой зовём руками.
      - name: Пересобрать сайт
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
